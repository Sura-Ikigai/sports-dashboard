name: CI

# When does this run?
on:
  pull_request:
    branches: [main] # Every PR targeting main
  push:
    branches: [main] # Also on direct pushes to main

jobs:
  # ── JOB 1: FRONTEND CHECKS ───────────────────────────────
  frontend:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest # GitHub provides this VM for free

    steps:
      # Step 1: Check out your code onto the VM
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm" # Caches node_modules between runs — faster
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Install dependencies
      - name: Install dependencies
        working-directory: frontend
        run: npm ci # ci is stricter than install — uses exact lockfile versions

      # Step 4: Type check
      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit # Checks types without building

      # Step 5: Lint
      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Step 6: Unit test the custom hooks
      - name: Test
        working-directory: frontend
        run: npm test

  # ── JOB 2: BACKEND CHECKS ────────────────────────────────
  backend:
    name: Backend — Lint & Tests
    runs-on: ubuntu-latest

    # Spin up a Postgres service container for tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        # Both files. requirements.txt is what the served image gets; requirements-train.txt adds
        # pandas/numpy, which backend/model/ needs and the Dockerfile deliberately never installs.
        #
        # Installing them here does NOT weaken D-016 — that decision is about the served image, and
        # backend/Dockerfile still installs requirements.txt alone. What it fixes is the other half:
        # every backend/model/ test used `importorskip("pandas")` and therefore SKIPPED in CI, so
        # the loader's verification machinery and the dataset adapter were green here without ever
        # having run. D-046 has since made that machinery the integrity guarantee for the whole
        # Postgres corpus, and a test that silently skips in CI is not a test (F-037, F-091).
        run: |
          pip install -r requirements.txt
          pip install -r requirements-train.txt

      - name: Lint with ruff
        working-directory: backend
        run: |
          pip install ruff==0.16.0
          ruff check .

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/${{ secrets.DB_NAME }}
        run: |
          pip install pytest pytest-asyncio httpx respx
          pytest tests/ -v        # Will pass if no tests yet — add a /tests folder
