# Dev-System gate (SYSTEM.md §6.3) — the REQUIRED status check on `main`.
#
# The `gate` job name below is what to mark as a required status check in branch protection
# (see docs/BRANCH-PROTECTION.md). That is the mechanical replacement for "don't push to main
# until I say".
#
# This workflow is ONE caller of the host-agnostic runner (checks/run-gate.mjs), not the definition
# of the gate. Locally: node checks/run-gate.mjs --stack stacks/nextjs-fastapi-postgres.md
#
# SECURITY (do not change without understanding): the manifest's `run:` commands are arbitrary
# trusted config and execute by design. This job must therefore NEVER be granted deploy/service
# secrets, and the trigger must stay `on: pull_request` — NEVER `pull_request_target`, which would
# run a fork's edited `run:` with repo secrets. Deploys live in a separate, protected workflow.

name: gate

on:
  pull_request:
    branches: [main]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

# The job runs arbitrary trusted config (manifest `run:` commands, plus npm lifecycle scripts via
# `npm ci`). Give it the least token it can do its job with, and do not leave a credential on disk
# for those commands to find.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # review-ledger-current needs history to compute the code tip
          # Don't write the GITHUB_TOKEN into .git/config where every `run:` command can read it.
          # review-ledger-current only runs `git log` against the local clone, so nothing needs it.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # --- project dependencies ---
      # run-gate and both meta-checks import only node: builtins and ./lib, so the gate itself needs
      # no install here -- but the meta-unit check runs `npm --prefix checks ci`, which does.
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install backend deps
        working-directory: backend
        # Pinned exactly, like requirements.txt -- an unpinned dev tool means the gate can change
        # meaning between two runs of the same commit.
        run: |
          pip install -r requirements.txt
          pip install ruff==0.16.0 pytest==9.1.1 pytest-asyncio==1.4.0 respx==0.23.1

      # --- the whole deterministic gate, through the host-agnostic runner ---
      # be-unit runs on in-memory SQLite (backend/conftest.py), so no Postgres service is needed.
      - name: run gate
        run: node checks/run-gate.mjs --stack stacks/nextjs-fastapi-postgres.md
